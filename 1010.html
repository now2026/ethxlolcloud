<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure JSON Fetcher - Fast & Private</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        h1 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 3px solid #60a5fa;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        .status-box.success {
            border-left-color: #34d399;
        }
        .status-box.error {
            border-left-color: #f87171;
        }
        .status-box.loading {
            border-left-color: #fbbf24;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none;
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(124, 58, 237, 0.5);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .privacy-badge {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .privacy-badge span {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .privacy-badge .icon {
            font-size: 1rem;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            padding: 0 5px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .btn { padding: 10px 18px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Secure JSON Fetcher</h1>
    <p class="subtitle">Fast · Private · Zero Tracking</p>

    <div id="statusDisplay" class="status-box loading">
        ⏳ Initializing secure connection...
    </div>

    <div class="btn-group">
        <button id="fetchBtn" class="btn btn-primary">
            <span>🚀</span> Fetch river1.json
        </button>
        <button id="clearBtn" class="btn btn-danger">
            <span>🗑️</span> Clear
        </button>
        <button id="copyBtn" class="btn btn-secondary">
            <span>📋</span> Copy
        </button>
        <button id="downloadBtn" class="btn btn-secondary">
            <span>⬇️</span> Download
        </button>
    </div>

    <div class="privacy-badge">
        <span><span class="icon">🔒</span> Encrypted (HTTPS)</span>
        <span><span class="icon">🛡️</span> No Local Storage</span>
        <span><span class="icon">🚫</span> No Tracking</span>
        <span><span class="icon">⏱️</span> 10s Timeout</span>
        <span><span class="icon">🔄</span> Auto-Retry (2x)</span>
    </div>
    <div class="stats">
        <span id="sizeInfo">📦 Size: —</span>
        <span id="timeInfo">⏱️ Load time: —</span>
    </div>
    <div class="footer">Built with privacy &amp; performance in mind</div>
</div>

<script>
    (function() {
        'use strict';

        // ===== Advanced Privacy & Performance Configuration =====
        const CONFIG = {
            url: 'river1.json',
            timeout: 10000,        // 10 seconds timeout
            retries: 2,            // Retry attempts
            cache: 'no-store',     // Prevent caching
            credentials: 'omit',   // No cookies sent
            mode: 'cors',          // CORS mode
            referrerPolicy: 'no-referrer', // High privacy
            headers: {
                'Accept': 'application/json',
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache'
            }
        };

        // ===== DOM Elements =====
        const statusDisplay = document.getElementById('statusDisplay');
        const fetchBtn = document.getElementById('fetchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const sizeInfo = document.getElementById('sizeInfo');
        const timeInfo = document.getElementById('timeInfo');

        let currentData = null;
        let isFetching = false;
        let loadStartTime = 0;

        // ===== Helper Functions =====
        function setStatus(message, type = 'loading') {
            statusDisplay.textContent = message;
            statusDisplay.className = 'status-box ' + type;
        }

        function formatJSON(data) {
            try {
                return JSON.stringify(data, null, 2);
            } catch (e) {
                return String(data);
            }
        }

        function getDataSize(data) {
            try {
                const json = formatJSON(data);
                const bytes = new Blob([json]).size;
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            } catch (e) {
                return '—';
            }
        }

        function displayData(data) {
            const formatted = formatJSON(data);
            statusDisplay.textContent = formatted;
            statusDisplay.className = 'status-box success';
            currentData = data;
            
            // Update stats
            sizeInfo.textContent = '📦 Size: ' + getDataSize(data);
            if (loadStartTime > 0) {
                const loadTime = (performance.now() - loadStartTime).toFixed(0);
                timeInfo.textContent = '⏱️ Load time: ' + loadTime + 'ms';
            }
        }

        function displayError(message) {
            setStatus('❌ ' + message, 'error');
            currentData = null;
            sizeInfo.textContent = '📦 Size: —';
        }

        // ===== Core Fetch with Retry Logic =====
        async function fetchWithRetry(url, options, retries) {
            let lastError;
            for (let i = 0; i <= retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), CONFIG.timeout);

                    const response = await fetch(url, {
                        ...options,
                        signal: controller.signal,
                        cache: CONFIG.cache,
                        credentials: CONFIG.credentials,
                        mode: CONFIG.mode,
                        referrerPolicy: CONFIG.referrerPolicy,
                        headers: CONFIG.headers
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    // Read as text first for security validation
                    const text = await response.text();
                    try {
                        const json = JSON.parse(text);
                        return { success: true, data: json };
                    } catch (parseError) {
                        throw new Error('Invalid JSON format');
                    }

                } catch (error) {
                    lastError = error;
                    if (i < retries) {
                        // Exponential backoff
                        const delay = 500 * Math.pow(2, i);
                        setStatus(`🔄 Retry ${i + 1}/${retries} in ${delay}ms...`, 'loading');
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            return { success: false, error: lastError };
        }

        // ===== Main Fetch Function =====
        async function fetchData() {
            if (isFetching) return;
            isFetching = true;
            fetchBtn.disabled = true;
            loadStartTime = performance.now();
            setStatus('⏳ Fetching data securely...', 'loading');

            try {
                const result = await fetchWithRetry(CONFIG.url, {}, CONFIG.retries);

                if (result.success) {
                    displayData(result.data);
                } else {
                    let errorMsg = 'Failed to fetch';
                    if (result.error) {
                        if (result.error.name === 'AbortError') {
                            errorMsg = 'Request timeout (10s)';
                        } else if (result.error.message.includes('Invalid JSON')) {
                            errorMsg = 'Invalid JSON format';
                        } else {
                            errorMsg = result.error.message || errorMsg;
                        }
                    }
                    displayError(errorMsg);
                }
            } catch (err) {
                displayError('Unexpected error: ' + err.message);
            } finally {
                isFetching = false;
                fetchBtn.disabled = false;
            }
        }

        // ===== Utility Functions =====
        function clearData() {
            if (isFetching) return;
            setStatus('🗑️ Data cleared', 'loading');
            currentData = null;
            sizeInfo.textContent = '📦 Size: —';
            timeInfo.textContent = '⏱️ Load time: —';
            setTimeout(() => {
                setStatus('💡 Press "Fetch" to load data', 'loading');
            }, 800);
        }

        function copyData() {
            if (currentData === null) {
                setStatus('⚠️ No data to copy', 'error');
                setTimeout(() => {
                    if (currentData !== null) {
                        displayData(currentData);
                    } else {
                        setStatus('💡 Press "Fetch" to load data', 'loading');
                    }
                }, 1500);
                return;
            }

            try {
                const text = formatJSON(currentData);
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        setStatus('✅ Copied to clipboard!', 'success');
                        setTimeout(() => {
                            if (currentData !== null) {
                                displayData(currentData);
                            }
                        }, 1500);
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            } catch (e) {
                displayError('Copy failed: ' + e.message);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                setStatus('✅ Copied (fallback method)', 'success');
                setTimeout(() => {
                    if (currentData !== null) {
                        displayData(currentData);
                    }
                }, 1500);
            } catch (e) {
                displayError('Copy failed: ' + e.message);
            }
            document.body.removeChild(textarea);
        }

        function downloadData() {
            if (currentData === null) {
                setStatus('⚠️ No data to download', 'error');
                setTimeout(() => {
                    if (currentData !== null) {
                        displayData(currentData);
                    } else {
                        setStatus('💡 Press "Fetch" to load data', 'loading');
                    }
                }, 1500);
                return;
            }

            try {
                const json = formatJSON(currentData);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'river1.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                setStatus('⬇️ Download started!', 'success');
                setTimeout(() => {
                    if (currentData !== null) {
                        displayData(currentData);
                    }
                }, 1500);
            } catch (e) {
                displayError('Download failed: ' + e.message);
            }
        }

        // ===== Event Listeners =====
        fetchBtn.addEventListener('click', fetchData);
        clearBtn.addEventListener('click', clearData);
        copyBtn.addEventListener('click', copyData);
        downloadBtn.addEventListener('click', downloadData);

        // ===== Keyboard Shortcuts =====
        document.addEventListener('keydown', (e) => {
            // Ctrl+F or Cmd+F to fetch
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                fetchData();
            }
            // Ctrl+C or Cmd+C to copy (only if not in input)
            if ((e.ctrlKey || e.metaKey) && e.key === 'c' && 
                !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
                // Let default copy work if text is selected, otherwise copy our data
                if (!window.getSelection()?.toString()) {
                    e.preventDefault();
                    copyData();
                }
            }
        });

        // ===== Auto-load on page open =====
        window.addEventListener('load', () => {
            setTimeout(fetchData, 300);
        });

        // ===== Security: Prevent tracking and data leakage =====
        // Disable context menu to prevent accidental data exposure
        document.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.status-box')) {
                e.preventDefault();
            }
        });

        // ===== Console security =====
        console.log('✅ Secure JSON Fetcher initialized');
        console.log('🔒 Privacy features: HTTPS, no-cache, no-cookies, no-referrer');
        console.log('⏱️ Timeout: 10s, Retries: 2');
        console.log('⌨️ Shortcuts: Ctrl+F to fetch, Ctrl+C to copy');

        // Prevent accidental data exposure via console
        Object.defineProperty(window, 'currentData', {
            get: function() { 
                console.warn('⚠️ Accessing data via console is not recommended for privacy reasons.');
                return currentData; 
            }
        });

    })();
</script>
</body>
</html>
