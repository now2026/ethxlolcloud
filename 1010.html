<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Data - Elegant Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        /* ===== Ambient Glow Effect ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, 
                rgba(10, 30, 60, 0.3) 0%, 
                transparent 70%);
            animation: ambientPulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes ambientPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* ===== Main Container ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(145deg, 
                rgba(8, 12, 30, 0.95), 
                rgba(2, 6, 20, 0.98));
            border-radius: 32px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* ===== Custom Border Frame ===== */
        .frame {
            position: relative;
            padding: 3px;
            border-radius: 28px;
            background: linear-gradient(135deg, 
                rgba(30, 60, 120, 0.3), 
                rgba(10, 20, 50, 0.1),
                rgba(30, 60, 120, 0.3));
            transition: all 0.6s ease;
        }

        .frame::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(60, 120, 220, 0.1) 25%,
                rgba(100, 180, 255, 0.05) 50%,
                rgba(60, 120, 220, 0.1) 75%,
                transparent 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderRotate 10s linear infinite;
        }

        @keyframes borderRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .frame-inner {
            background: rgba(6, 10, 26, 0.6);
            border-radius: 26px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* ===== Decorative Corner Accents ===== */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(100, 180, 255, 0.08);
            pointer-events: none;
            opacity: 0.5;
        }

        .corner-tl {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
            border-radius: 4px 0 0 0;
        }

        .corner-tr {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 4px 0 0;
        }

        .corner-bl {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 4px;
        }

        .corner-br {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 4px 0;
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .header::after {
            content: '✦';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 180, 255, 0.2);
            font-size: 0.8rem;
            background: rgba(6, 10, 26, 0.8);
            padding: 0 15px;
        }

        .header-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.6;
            letter-spacing: 8px;
        }

        .header h1 {
            font-family: 'Georgia', serif;
            font-weight: 300;
            font-size: 2.2rem;
            color: #f0f4ff;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(100, 180, 255, 0.05);
        }

        .header .sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 8px;
            font-family: 'Arial', sans-serif;
        }

        /* ===== Content Display ===== */
        .content-area {
            min-height: 200px;
            position: relative;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-top: 2px solid rgba(100, 180, 255, 0.3);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.85rem;
            letter-spacing: 4px;
            font-family: 'Arial', sans-serif;
        }

        /* ===== Beautiful Text Display ===== */
        .json-content {
            color: #f0f4ff;
            line-height: 1.9;
            font-size: 1.05rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 5px 0;
            position: relative;
        }

        .json-content .title {
            font-size: 1.8rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-family: 'Georgia', serif;
        }

        .json-content .section {
            margin-bottom: 25px;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border-left: 2px solid rgba(100, 180, 255, 0.08);
            transition: all 0.3s ease;
        }

        .json-content .section:hover {
            background: rgba(255, 255, 255, 0.03);
            border-left-color: rgba(100, 180, 255, 0.15);
        }

        .json-content .section strong {
            color: rgba(180, 220, 255, 0.8);
            font-weight: 400;
            display: block;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: 'Arial', sans-serif;
        }

        .json-content .section .value {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #f0f4ff;
        }

        .json-content .section .value p {
            margin-bottom: 10px;
        }

        .json-content .section .value p:last-child {
            margin-bottom: 0;
        }

        .json-content .meta {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(100, 180, 255, 0.04);
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            font-family: 'Arial', sans-serif;
            margin-top: 5px;
        }

        .json-content .divider {
            height: 1px;
            background: linear-gradient(to right, 
                transparent, 
                rgba(255, 255, 255, 0.03), 
                transparent);
            margin: 30px 0;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-family: 'Arial', sans-serif;
        }

        /* ===== Footer Controls ===== */
        .controls {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: rgba(100, 180, 255, 0.04);
            border-color: rgba(100, 180, 255, 0.06);
            color: rgba(180, 220, 255, 0.4);
        }

        .btn-primary:hover {
            background: rgba(100, 180, 255, 0.08);
            color: rgba(180, 220, 255, 0.6);
            border-color: rgba(100, 180, 255, 0.12);
        }

        /* ===== Status Message ===== */
        .status-msg {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 3px;
            margin-top: 20px;
            font-family: 'Arial', sans-serif;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 20px;
            }
            .frame-inner {
                padding: 20px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .json-content .title {
                font-size: 1.3rem;
            }
            .json-content .section {
                padding: 15px;
            }
            .corner {
                width: 20px;
                height: 20px;
            }
            .corner-tl, .corner-tr { top: 8px; }
            .corner-bl, .corner-br { bottom: 8px; }
            .corner-tl, .corner-bl { left: 8px; }
            .corner-tr, .corner-br { right: 8px; }
        }

        @media (max-width: 480px) {
            body { padding: 15px; }
            .container { padding: 12px; }
            .frame-inner { padding: 15px; }
            .header h1 { font-size: 1.2rem; }
            .btn { padding: 8px 16px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="frame">
        <div class="frame-inner">
            
            <!-- ===== Corner Decorations ===== -->
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <!-- ===== HEADER ===== -->
            <div class="header">
                <span class="header-icon">⌇</span>
                <h1>River Data</h1>
                <div class="sub">✦ Elegant JSON Display ✦</div>
            </div>

            <!-- ===== CONTENT ===== -->
            <div class="content-area" id="contentArea">
                <!-- Loading State (will be replaced) -->
                <div class="loading-state" id="loadingState">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading Data...</div>
                </div>

                <!-- Content Container -->
                <div id="contentDisplay" style="display: none;"></div>
            </div>

            <!-- ===== CONTROLS ===== -->
            <div class="controls">
                <button class="btn btn-primary" id="refreshBtn">⟳ Refresh</button>
                <button class="btn" id="copyBtn">⌘ Copy</button>
                <button class="btn" id="downloadBtn">⬇ Download</button>
            </div>

            <div class="status-msg" id="statusMsg">✦ secure · private · elegant ✦</div>

        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        const CONFIG = {
            url: 'about-river1.json',
            timeout: 8000,
            retries: 2
        };

        const contentArea = document.getElementById('contentArea');
        const loadingState = document.getElementById('loadingState');
        const contentDisplay = document.getElementById('contentDisplay');
        const statusMsg = document.getElementById('statusMsg');
        const refreshBtn = document.getElementById('refreshBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentData = null;
        let isFetching = false;

        // ===== Beautiful Rendering =====
        function renderContent(data) {
            if (!data) return;

            let html = '<div class="json-content">';

            // If data has a title or name
            if (data.title || data.name) {
                html += `<div class="title">${data.title || data.name}</div>`;
            }

            // Render each key-value pair beautifully
            const excludeKeys = ['title', 'name'];
            let hasContent = false;

            for (const [key, value] of Object.entries(data)) {
                if (excludeKeys.includes(key)) continue;
                if (value === null || value === undefined || value === '') continue;

                hasContent = true;
                
                // Format the value
                let displayValue = value;
                if (typeof value === 'string') {
                    // Convert newlines to <br>
                    displayValue = value.replace(/\n/g, '<br>');
                } else if (typeof value === 'object') {
                    displayValue = JSON.stringify(value, null, 2);
                    displayValue = displayValue.replace(/\n/g, '<br>');
                }

                // Format key name (capitalize, replace underscores)
                const keyName = key
                    .replace(/_/g, ' ')
                    .replace(/([A-Z])/g, ' $1')
                    .trim()
                    .split(' ')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');

                html += `
                    <div class="section">
                        <strong>${keyName}</strong>
                        <div class="value">${displayValue}</div>
                        ${typeof value === 'string' && value.length > 50 ? `<span class="meta">${value.length} characters</span>` : ''}
                    </div>
                `;
            }

            // If no content was rendered (only title), show raw JSON
            if (!hasContent && Object.keys(data).length > 0) {
                html += `<div class="section"><div class="value"><pre style="color:rgba(255,255,255,0.6);font-family:'Courier New',monospace;font-size:0.8rem;">${JSON.stringify(data, null, 2)}</pre></div></div>`;
            }

            html += '</div>';
            return html;
        }

        // ===== Display Data =====
        function displayData(data) {
            currentData = data;
            loadingState.style.display = 'none';
            contentDisplay.style.display = 'block';
            
            const rendered = renderContent(data);
            if (rendered) {
                contentDisplay.innerHTML = rendered;
            } else {
                contentDisplay.innerHTML = `<div class="empty-state">✦ No data to display ✦</div>`;
            }
            
            statusMsg.textContent = '✦ data loaded · ' + new Date().toLocaleTimeString() + ' ✦';
        }

        // ===== Show Error =====
        function showError(message) {
            loadingState.style.display = 'none';
            contentDisplay.style.display = 'block';
            contentDisplay.innerHTML = `
                <div class="empty-state" style="color:rgba(255,255,255,0.1);">
                    ⚡ ${message}<br>
                    <span style="font-size:0.7rem;letter-spacing:2px;">please refresh or try again</span>
                </div>
            `;
            statusMsg.textContent = '✦ ' + message.toLowerCase() + ' ✦';
        }

        // ===== Fetch with Retry =====
        async function fetchWithRetry(url, retries) {
            let lastError;
            for (let i = 0; i <= retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), CONFIG.timeout);

                    const response = await fetch(url, {
                        signal: controller.signal,
                        cache: 'no-store',
                        credentials: 'omit',
                        mode: 'cors',
                        referrerPolicy: 'no-referrer',
                        headers: {
                            'Accept': 'application/json',
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache'
                        }
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const text = await response.text();
                    try {
                        const json = JSON.parse(text);
                        return { success: true, data: json };
                    } catch (e) {
                        throw new Error('Invalid JSON format');
                    }

                } catch (error) {
                    lastError = error;
                    if (i < retries) {
                        await new Promise(r => setTimeout(r, 500 * (i + 1)));
                    }
                }
            }
            return { success: false, error: lastError };
        }

        // ===== Main Fetch =====
        async function fetchData() {
            if (isFetching) return;
            isFetching = true;
            refreshBtn.disabled = true;

            loadingState.style.display = 'flex';
            contentDisplay.style.display = 'none';
            statusMsg.textContent = '✦ loading... ✦';

            try {
                const result = await fetchWithRetry(CONFIG.url, CONFIG.retries);

                if (result.success && result.data) {
                    displayData(result.data);
                } else {
                    let msg = 'Failed to load data';
                    if (result.error) {
                        if (result.error.name === 'AbortError') msg = 'Request timeout';
                        else if (result.error.message) msg = result.error.message;
                    }
                    showError(msg);
                }
            } catch (err) {
                showError('Unexpected error');
            } finally {
                isFetching = false;
                refreshBtn.disabled = false;
            }
        }

        // ===== Copy Data =====
        function copyData() {
            if (!currentData) {
                statusMsg.textContent = '✦ no data to copy ✦';
                return;
            }
            try {
                const text = JSON.stringify(currentData, null, 2);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        statusMsg.textContent = '✦ copied to clipboard ✦';
                        setTimeout(() => {
                            if (currentData) {
                                statusMsg.textContent = '✦ data loaded · ' + new Date().toLocaleTimeString() + ' ✦';
                            }
                        }, 2000);
                    });
                } else {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    statusMsg.textContent = '✦ copied (fallback) ✦';
                }
            } catch (e) {
                statusMsg.textContent = '✦ copy failed ✦';
            }
        }

        // ===== Download =====
        function downloadData() {
            if (!currentData) {
                statusMsg.textContent = '✦ no data to download ✦';
                return;
            }
            try {
                const json = JSON.stringify(currentData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'about-river1.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusMsg.textContent = '✦ download started ✦';
                setTimeout(() => {
                    if (currentData) {
                        statusMsg.textContent = '✦ data loaded · ' + new Date().toLocaleTimeString() + ' ✦';
                    }
                }, 2000);
            } catch (e) {
                statusMsg.textContent = '✦ download failed ✦';
            }
        }

        // ===== Event Listeners =====
        refreshBtn.addEventListener('click', fetchData);
        copyBtn.addEventListener('click', copyData);
        downloadBtn.addEventListener('click', downloadData);

        // ===== Auto Load =====
        window.addEventListener('load', () => {
            setTimeout(fetchData, 400);
        });

        // ===== Keyboard Shortcuts =====
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                e.preventDefault();
                fetchData();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'c' && 
                !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
                if (!window.getSelection()?.toString()) {
                    e.preventDefault();
                    copyData();
                }
            }
        });

        console.log('✦ River Data Display initialized ✦');
        console.log('⌨️  Ctrl+R: Refresh  |  Ctrl+C: Copy');

    })();
</script>

</body>
</html>
